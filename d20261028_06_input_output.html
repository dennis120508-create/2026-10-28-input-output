<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抽卡期望值模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#d6d3f4;
  --panel:rgba(252,251,248,.95);
  --panel-edge:#c9b27a;
  --ink:#1f2442;
  --ink-soft:#454b6b;
  --gold:#8a6216;
  --shimmer-mid:#d29a2c;
  --gold-bright:#e2b65a;
  --field:#ffffff;
  --field-edge:#d6cfbd;
  --miss:#6f8fc7;
  --miss-deep:#3f5c96;
  --hit-glow:rgba(226,182,90,.7);
  --btn-ink:#3a2f17;
  --title-shadow:0 1px 0 #fff,0 0 18px rgba(255,255,255,.9);
  --err:#c0504d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f1436;
    --panel:rgba(20,24,58,.94);
    --panel-edge:#8f7642;
    --ink:#f3ecda; --ink-soft:#cbc8de;
    --gold:#ecc77a; --gold-bright:#f3d38a; --shimmer-mid:#fff3c4;
    --field:#141838; --field-edge:#3b4277;
    --miss:#7c9be0; --miss-deep:#34508f;
    --hit-glow:rgba(243,211,138,.75);
    --btn-ink:#2a2110;
    --title-shadow:0 0 16px rgba(243,211,138,.45);
    --err:#ff8a80;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f1436;
  --panel:rgba(20,24,58,.94);
  --panel-edge:#8f7642;
  --ink:#f3ecda; --ink-soft:#cbc8de;
  --gold:#ecc77a; --gold-bright:#f3d38a; --shimmer-mid:#fff3c4;
  --field:#141838; --field-edge:#3b4277;
  --miss:#7c9be0; --miss-deep:#34508f;
  --hit-glow:rgba(243,211,138,.75);
  --btn-ink:#2a2110;
  --title-shadow:0 0 16px rgba(243,211,138,.45);
  --err:#ff8a80;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color:var(--ink);background:var(--bg);
  min-height:100vh;line-height:1.7;
}
#scene,#sparkle{position:fixed;inset:0;width:100%;height:100%;display:block}
#scene{z-index:0}
#sparkle{z-index:60;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:32px 20px 56px}
header{text-align:center;margin-bottom:28px}
h1{font-weight:900;font-size:clamp(1.8rem,4.5vw,2.6rem);letter-spacing:.12em;margin:0;color:var(--gold);text-shadow:var(--title-shadow)}
.ornament{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px auto 0;color:var(--gold);max-width:360px}
.ornament::before,.ornament::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
header p{display:inline-block;color:var(--ink);margin:12px auto 0;padding:6px 18px;font-size:1rem;font-weight:600;max-width:34em;background:var(--panel);border:1px solid var(--panel-edge);border-radius:18px}
h1{padding:4px 22px;border-radius:6px}

.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}

.frame{
  position:relative;background:var(--panel);
  border:1px solid var(--panel-edge);
  outline:1px solid var(--panel-edge);outline-offset:-7px;
  border-radius:4px;padding:26px 24px;
}
.frame::before,.frame::after{content:"";position:absolute;width:10px;height:10px;background:var(--gold);transform:rotate(45deg);top:-6px;left:calc(50% - 5px)}
.frame::after{top:auto;bottom:-6px}
h2{font-size:1.15rem;font-weight:600;margin:0 0 18px;letter-spacing:.08em;text-align:center}

.field{margin-bottom:18px}
.field label,.switch-row label{display:block;font-size:.98rem;font-weight:600;margin-bottom:6px}
.inline{display:flex;align-items:center;gap:8px}
.inline span{color:var(--ink-soft);font-size:.95rem;white-space:nowrap}
input[type=number]{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--field);border:1px solid var(--field-edge);border-radius:3px;padding:8px 10px}
input[type=number]:focus-visible,button:focus-visible,.switch input:focus-visible+.track{outline:2px solid var(--gold-bright);outline-offset:2px}
.hint{font-size:.86rem;color:var(--ink-soft);margin-top:4px}
.err{font-size:.88rem;font-weight:600;color:var(--err);margin-top:4px}
.err:empty{display:none}

.switch-row{display:flex;justify-content:space-between;align-items:center}
.switch{position:relative;display:inline-block;width:52px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.track{position:absolute;inset:0;border-radius:14px;background:var(--field-edge);transition:background .2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+.track{background:var(--gold)}
.switch input:checked+.track::after{transform:translateX(24px)}
#pityField{overflow:hidden;transition:max-height .3s ease,opacity .3s,margin .3s;max-height:0;opacity:0;margin-top:0}
#pityField.open{max-height:160px;opacity:1;margin-top:12px}

.submit{
  width:100%;margin-top:22px;font:inherit;font-weight:600;font-size:1.05rem;letter-spacing:.1em;cursor:pointer;
  color:#fff7e0;border:1px solid var(--gold);border-radius:3px;padding:10px;
  background:linear-gradient(180deg,#46558f,#2b3566);
  box-shadow:inset 0 0 0 2px rgba(243,211,138,.35);
}
.submit:hover{filter:brightness(1.12)}
.submit:active{transform:translateY(1px)}
.dirty{font-size:.88rem;font-weight:600;color:var(--gold);text-align:center;margin-top:8px;visibility:hidden}
.dirty.show{visibility:visible}

.ev{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}
@media (max-width:480px){.ev{grid-template-columns:1fr}}
.ev-item{text-align:center;padding:14px 8px;border-top:1px solid var(--panel-edge);border-bottom:1px solid var(--panel-edge)}
.ev-item.refresh{animation:evGlow .9s ease}
@keyframes evGlow{0%{background:rgba(243,211,138,.35)}100%{background:transparent}}
.ev-item .k{font-size:.95rem;font-weight:600;color:var(--ink-soft)}
.ev-item .v{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:900;color:var(--gold);line-height:1.3;font-variant-numeric:tabular-nums}
.ev-item .u{font-size:.9rem;color:var(--ink-soft)}
.quant{font-size:.94rem;color:var(--ink-soft);text-align:center;margin:12px 0 0}
.quant b{color:var(--ink);font-weight:600}

.stage{margin-top:26px}
.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.pull{
  font:inherit;font-weight:600;font-size:1rem;cursor:pointer;
  color:var(--btn-ink);border:1px solid var(--gold);border-radius:22px;
  background:linear-gradient(180deg,#f7e7bf,#e4c27c);
  padding:9px 26px;min-width:140px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);
}
.pull:hover{filter:brightness(1.06)}
.pull:active{transform:translateY(1px)}
.pull:disabled,.ghost:disabled{opacity:.5;cursor:not-allowed}
.ghost{font:inherit;font-size:.9rem;cursor:pointer;background:transparent;color:var(--ink-soft);border:1px solid var(--field-edge);border-radius:22px;padding:9px 18px}

.results{
  position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;
  min-height:150px;padding:14px;border-radius:4px;
  background:linear-gradient(180deg,rgba(15,20,54,.55),rgba(15,20,54,.8));
}
@media (max-width:640px){.results{grid-template-columns:repeat(5,minmax(0,1fr))}}
.results.gold-ring::after{
  content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;
  box-shadow:0 0 0 2px var(--gold-bright),0 0 30px var(--hit-glow);
  animation:ring 1.6s ease-out forwards;
}
@keyframes ring{0%{opacity:0}20%{opacity:1}100%{opacity:.35}}
.empty{grid-column:1/-1;align-self:center;text-align:center;color:#e4e7f7;font-size:1rem}

.card{position:relative;isolation:isolate;aspect-ratio:3/5;perspective:600px;opacity:0;transform:translateY(-16px);animation:drop .35s ease forwards}
@keyframes drop{to{opacity:1;transform:none}}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:3px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8%}
.back{
  background:radial-gradient(circle at 50% 40%,#3d4f9c,#151c45 70%);
  border:1px solid #c9a75c;justify-content:center;padding:0;color:#e9cf8f;font-size:1.1rem;
}
.back::before{content:"";position:absolute;inset:4px;border:1px solid rgba(233,207,143,.35);border-radius:2px}
.back{transform:rotateY(0deg)}
.front{transform:rotateY(180deg);visibility:hidden}
/* Swap faces at mid-flip so the result never depends on backface-visibility alone */
.card .back,.card .front{transition:visibility 0s linear .13s}
.card.flipped .back{visibility:hidden}
.card.flipped .front{visibility:visible}
.front .gem{position:absolute;top:28%;left:50%;width:42%;aspect-ratio:1;transform:translateX(-50%) rotate(45deg);border:2px solid rgba(255,255,255,.8)}
.front .stars{position:relative;font-size:clamp(.55rem,1.4vw,.78rem);color:#fff0c2;letter-spacing:-1px;text-shadow:0 0 2px #000,0 1px 3px rgba(0,0,0,.8)}
.front .n{position:relative;font-size:.74rem;font-weight:600;color:#fff;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.75)}
.miss .front{background:linear-gradient(180deg,var(--miss),var(--miss-deep))}
.miss .front .gem{background:rgba(255,255,255,.15)}
.hit .front{background:linear-gradient(180deg,#ffe3a0,#b7802a)}
.hit .front .gem{background:rgba(255,255,255,.5);box-shadow:0 0 16px #fff}
.hit .front::before{
  content:"";position:absolute;inset:-60%;
  background:conic-gradient(from 0deg,transparent 0 20deg,rgba(255,255,255,.45) 25deg,transparent 30deg 110deg,rgba(255,255,255,.4) 115deg,transparent 120deg 200deg,rgba(255,255,255,.45) 205deg,transparent 210deg 290deg,rgba(255,255,255,.4) 295deg,transparent 300deg);
  animation:spin 5s linear infinite;
}
.hit.flipped{animation:none;opacity:1;transform:none}
.card::before{content:"";position:absolute;inset:-10px;border-radius:10px;z-index:-1;opacity:0;pointer-events:none;background:radial-gradient(closest-side,var(--hit-glow),transparent)}
.hit.flipped::before{animation:pulse 1.8s ease-in-out .55s infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.hit.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.25)}60%{transform:scale(.96)}100%{transform:scale(1)}}

/* Gold card: anticipation before the flip */
.card.charging{opacity:1;transform:none;animation:tremble .7s ease-in}
.card.charging .back{animation:charge .7s ease-in forwards}
@keyframes tremble{0%,100%{transform:none}20%{transform:translate(-1px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-2px,2px) scale(1.04)}80%{transform:translate(3px,-2px) scale(1.07)}}
/* charge = fade in a pre-painted gold layer + outer glow (opacity only, GPU friendly) */
.back::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#ffe9a8,#c58a2a 75%);opacity:0}
.card.charging .back::after{animation:fadeUp .7s ease-in forwards}
.card.charging::before{animation:fadeUp .7s ease-in forwards}
@keyframes fadeUp{to{opacity:1}}
@keyframes charge{}
/* Gold card: light sweep across the face, repeating */
.hit.flipped .front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.9) 48%,transparent 66%);transform:translateX(-130%);animation:sweep 2.8s ease .3s infinite}
@keyframes sweep{0%{transform:translateX(-130%)}35%,100%{transform:translateX(130%)}}
/* Gold card: screen-level effects */
.gfx-flash,.gfx-pillar,.gfx-shock{position:fixed;pointer-events:none;z-index:55;will-change:transform,opacity}
.gfx-flash{inset:0;background:radial-gradient(circle at var(--x) var(--y),rgba(255,248,215,.95),rgba(255,210,110,.55) 25%,transparent 70%);animation:gflash .75s ease-out forwards}
@keyframes gflash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.gfx-pillar{top:0;transform-origin:bottom;
  background:linear-gradient(to top,rgba(255,250,225,1),rgba(255,214,107,.75) 35%,rgba(255,214,107,0));
  animation:pillar 1.4s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes pillar{0%{transform:translateX(-50%) scaleY(0) scaleX(.4);opacity:1}25%{transform:translateX(-50%) scaleY(1) scaleX(1);opacity:1}100%{transform:translateX(-50%) scaleY(1) scaleX(.15);opacity:0}}
.gfx-shock{width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;
  background:radial-gradient(circle,transparent 60%,rgba(255,214,107,.35) 65%,rgba(255,236,180,.95) 68%,rgba(255,214,107,.35) 71%,transparent 76%);
  animation:shock .9s ease-out both}
.gfx-shock.late{animation-delay:.18s}
@keyframes shock{0%{transform:scale(.06);opacity:1}100%{transform:scale(1);opacity:0}}
.results.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.banner.gold{color:var(--gold);font-size:1.05rem;animation:bannerIn .6s ease}
@keyframes bannerIn{from{opacity:0;transform:translateY(6px)}}
@keyframes shimmer{to{background-position:-200% 0}}

.banner{text-align:center;font-weight:600;font-size:1rem;color:var(--gold);min-height:1.7em;margin:12px 0 4px}
/* Tally: pity gauge + stat tiles */
.tally{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center;margin-top:20px}
@media (max-width:560px){.tally{grid-template-columns:1fr}.gauge{margin:0 auto}}
.gauge{position:relative;width:150px;text-align:center}
.gauge .ring{position:relative;width:150px;height:150px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.g-track{fill:none;stroke:var(--field-edge);stroke-width:9}
.g-tick{fill:none;stroke:var(--panel);stroke-width:9;stroke-dasharray:1.2 15.13}
.g-fill{fill:none;stroke:url(#gGrad);stroke-width:9;stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset .5s cubic-bezier(.3,1.2,.5,1)}
.gauge.near .g-fill{animation:nearGlow 1.2s ease-in-out infinite}
@keyframes nearGlow{0%,100%{opacity:.65}50%{opacity:1}}
.g-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.g-num{font-size:2.4rem;font-weight:900;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.g-max{font-size:.92rem;font-weight:600;color:var(--ink-soft);margin-top:4px}
.g-label{font-size:.92rem;font-weight:600;color:var(--ink-soft);margin-top:6px}
.gauge.near .g-label{color:var(--gold)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{position:relative;padding:10px 12px 10px 16px;border:1px solid var(--field-edge);border-radius:3px;
  background:linear-gradient(135deg,rgba(226,182,90,.10),transparent 60%)}
.stat::before{content:"";position:absolute;left:-5px;top:50%;width:9px;height:9px;margin-top:-5px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 0 2px var(--panel)}
.stat .k{font-size:.86rem;font-weight:600;color:var(--ink-soft)}
.stat .v{display:inline-block;transform-origin:left center;font-size:1.55rem;font-weight:900;color:var(--ink);line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:.8rem;font-weight:600;color:var(--ink-soft);margin-left:3px}
.stat .v .pre{font-size:.85rem;font-weight:600;color:var(--ink-soft);margin-right:2px}
.stat.key .v{color:var(--gold)}
.stat .sub{font-size:.8rem;color:var(--ink-soft)}
.stat .sub:empty{display:none}
.stat .sub.up{color:#2e9b5f}
.stat .sub.down{color:var(--err)}
.stat.bump .v{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.15)}100%{transform:scale(1)}}
.log{margin-top:18px;max-height:180px;overflow-y:auto;font-size:.93rem;border-top:1px solid var(--field-edge);padding-top:10px}
.log h3{font-size:.92rem;margin:0 0 6px;font-weight:600}
.log ol{margin:0;padding-left:1.6em}
.log li{color:var(--ink-soft)}
.log li b{color:var(--gold)}
.log .none{list-style:none;margin-left:-1.6em}

/* Pull cinematic overlay */
.fx{position:fixed;inset:0;z-index:50;overflow:hidden;cursor:pointer;
  background:radial-gradient(ellipse at 50% 60%,rgba(20,26,70,.6),rgba(4,6,20,.92));
  animation:fxIn .25s ease}
.fx[hidden]{display:none}
@keyframes fxIn{from{opacity:0}}
.meteor{position:absolute;top:var(--top);left:105vw;width:var(--len);height:var(--th);border-radius:3px;
  background:linear-gradient(90deg,#fff 0,var(--mc) 6%,transparent);
  filter:drop-shadow(0 0 10px var(--mc));
  transform:rotate(-28deg);transform-origin:left center;
  animation:fall var(--dur) cubic-bezier(.4,0,.8,.6) var(--delay) forwards}
.meteor::before{content:"";position:absolute;left:-10px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 0 24px 10px var(--mc)}
@keyframes fall{to{transform:translate(-130vw,70vh) rotate(-28deg)}}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 40% 70%,#fff,var(--fc) 40%,transparent 75%);opacity:0;animation:flash .7s ease 1.05s forwards}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.fx .skip{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));color:rgba(255,255,255,.7);font-size:.85rem}

@media (prefers-reduced-motion: reduce){
  .card{animation:none;opacity:1;transform:none}
  .card .inner,.card .back,.card .front{transition:none}
  .hit .front::before,.hit.flipped::before,.hit.flipped .front::after,.banner.gold{animation:none}
  .banner.gold{color:var(--gold)}
  .gauge.near .g-fill,.stat.bump .v{animation:none}
  .g-fill{transition:none}
}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<canvas id="sparkle" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <h1>抽卡期望值模擬器</h1>
    <div class="ornament">✦</div>
    <p>輸入機率與單抽價格後按送出，算出平均要抽幾次、花多少錢，再親手抽抽看。</p>
  </header>

  <div class="grid">
    <section class="frame container-input" aria-labelledby="inTitle">
      <h2 id="inTitle">抽卡設定</h2>
      <form id="form" novalidate>
        <div class="field">
          <label for="rate">目標機率</label>
          <div class="inline">
            <input type="number" id="rate" min="0.001" max="100" step="0.001" value="0.6" inputmode="decimal">
            <span>%</span>
          </div>
          <div class="err" id="rateErr"></div>
        </div>

        <div class="field">
          <div class="switch-row">
            <label for="pityOn" style="margin:0">保底機制</label>
            <span class="switch">
              <input type="checkbox" id="pityOn" checked role="switch" aria-controls="pityField">
              <span class="track"></span>
            </span>
          </div>
          <div id="pityField" class="open">
            <label for="pity">保底抽數</label>
            <div class="inline">
              <input type="number" id="pity" min="1" step="1" value="90" inputmode="numeric">
              <span>抽必中</span>
            </div>
            <div class="hint">連續未中達此抽數時，該抽必定命中。</div>
            <div class="err" id="pityErr"></div>
          </div>
        </div>

        <div class="field" style="margin-bottom:0">
          <label for="price">單抽金額</label>
          <div class="inline">
            <span>NT$</span>
            <input type="number" id="price" min="0" step="1" value="50" inputmode="decimal">
          </div>
          <div class="err" id="priceErr"></div>
        </div>

        <button class="submit" type="submit">送出計算</button>
        <div class="dirty" id="dirty">設定已變更，按「送出計算」後生效</div>
      </form>
    </section>

    <section class="frame container-output" aria-labelledby="outTitle">
      <h2 id="outTitle">期望值</h2>

              <svg viewBox="0 0 120 120" aria-hidden="true">
                <defs><linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d38a"/><stop offset="1" stop-color="#c58a2a"/></linearGradient></defs>
                <circle class="g-track" cx="60" cy="60" r="52"/>
                <circle class="g-fill" id="gFill" cx="60" cy="60" r="52"/>
                <circle class="g-tick" cx="60" cy="60" r="52"/>
              </svg>
              <div class="g-center"><div class="g-num" id="gNum">0</div><div class="g-max" id="gMax">/ 90</div></div>
            </div>
            <div class="g-label" id="gLabel">保底進度</div>
          </div>

          <div class="stats">
            <div class="stat" id="tPulls"><div class="k">總抽數</div><div class="v"><span id="sPulls">0</span><small>抽</small></div><div class="sub" id="subPulls"></div></div>
            <div class="stat key" id="tHits"><div class="k">命中次數</div><div class="v"><span id="sHits">0</span><small>次</small></div><div class="sub" id="subHits"></div></div>
            <div class="stat" id="tCost"><div class="k">總花費</div><div class="v"><span class="pre">NT$</span><span id="sCost">0</span></div><div class="sub" id="subCost"></div></div>
            <div class="stat" id="tAvg"><div class="k">實際平均抽數</div><div class="v"><span id="sAvg">—</span><small>抽</small></div><div class="sub" id="subAvg"></div></div>
            <div class="stat" id="tRate"><div class="k">實際命中率</div><div class="v"><span id="sRate">—</span><small>%</small></div><div class="sub" id="subRate"></div></div>
            <div class="stat" id="tPity"><div class="k">保底觸發</div><div class="v"><span id="sPity">0</span><small>次</small></div><div class="sub" id="subPity"></div></div>
          </div>

          <h3>命中紀錄</h3>

    </section>
  </div>
</div>

<div class="fx" id="fx" hidden><div class="flash" id="flash"></div><div class="skip">點擊略過</div></div>

<script>
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function isDark(){
  const t = document.documentElement.dataset.theme;
  return t === 'dark' || (t !== 'light' && darkMQ.matches);
}

/* ================= Soft space background (optimised) ================= */
(function(){
  const cv=document.getElementById('scene'), ctx=cv.getContext('2d',{alpha:false});
  const STEP=1000/30;               // background only needs ~30fps
  const M=80;                       // margin baked around the nebula layer for drift/parallax
  let W=0,H=0, bg=null, planet=null, sprites=[], layers=[], meteors=[], nextMeteor=3000;
  let mx=0,my=0,px=0,py=0, last=0, acc=0, running=false;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const mk=(w,h)=>{ const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h)); return c; };

  function pal(){
    return isDark() ? {
      sky:['#070a22','#121845','#1f1742'],
      neb:['120,90,220,.30','60,140,230,.26','230,110,190,.18','90,200,210,.16'],
      star:['255,255,255','255,240,200','200,215,255'], blend:'lighter',
      planet:['#4b3f8f','#1b1a46'], ring:'rgba(200,190,255,.28)', meteor:'255,245,215'
    } : {
      sky:['#c3cdf3','#ddd6f6','#f5e3ef'],
      neb:['165,135,240,.32','135,185,250,.32','250,165,210,.28','150,225,225,.22'],
      star:['255,255,255','255,250,235','235,230,255'], blend:'source-over',
      planet:['#f0d9f2','#a99de0'], ring:'rgba(255,255,255,.55)', meteor:'255,255,255'
    };
  }

  // Bake sky + nebulae once, at 1/4 resolution (it is all soft gradients anyway)
  function bake(){
    const p=pal(), s=.25, bw=(W+2*M), bh=(H+2*M);
    bg=mk(bw*s,bh*s); const g=bg.getContext('2d'); g.scale(s,s);
    const lg=g.createLinearGradient(0,0,bw*.3,bh);
    lg.addColorStop(0,p.sky[0]); lg.addColorStop(.55,p.sky[1]); lg.addColorStop(1,p.sky[2]);
    g.fillStyle=lg; g.fillRect(0,0,bw,bh);
    g.globalCompositeOperation=p.blend;
    const R=Math.max(bw,bh);
    [[.22,.28,.45],[.78,.22,.40],[.62,.72,.50],[.15,.82,.38]].forEach(([x,y,r],i)=>{
      const cx=x*bw, cy=y*bh, rr=r*R, ng=g.createRadialGradient(cx,cy,0,cx,cy,rr);
      ng.addColorStop(0,`rgba(${p.neb[i]})`); ng.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=ng; g.fillRect(0,0,bw,bh);
    });
    // planet sprite
    const r=Math.min(W,H)*.22, pw=r*3.6, ph=r*2.4;
    planet=mk(pw,ph); const q=planet.getContext('2d'), cx=pw/2, cy=ph/2;
    const pg=q.createRadialGradient(cx-r*.35,cy-r*.4,r*.1,cx,cy,r);
    pg.addColorStop(0,p.planet[0]); pg.addColorStop(1,p.planet[1]);
    q.globalAlpha=.85; q.strokeStyle=p.ring; q.lineWidth=r*.07;
    q.beginPath(); q.ellipse(cx,cy,r*1.7,r*.38,-.25,Math.PI,Math.PI*2); q.stroke();
    q.fillStyle=pg; q.beginPath(); q.arc(cx,cy,r,0,Math.PI*2); q.fill();
    q.beginPath(); q.ellipse(cx,cy,r*1.7,r*.38,-.25,0,Math.PI); q.stroke();
    // glowing star sprites, one per colour
    sprites=p.star.map(rgb=>{
      const S=32, c=mk(S,S), x=c.getContext('2d'), h=S/2;
      const sg=x.createRadialGradient(h,h,0,h,h,h);
      sg.addColorStop(0,`rgba(${rgb},1)`); sg.addColorStop(.12,`rgba(${rgb},.9)`); sg.addColorStop(.35,`rgba(${rgb},.18)`); sg.addColorStop(1,`rgba(${rgb},0)`);
      x.fillStyle=sg; x.fillRect(0,0,S,S);
      x.strokeStyle=`rgba(${rgb},.45)`; x.lineWidth=1; x.beginPath(); x.moveTo(2,h); x.lineTo(S-2,h); x.moveTo(h,2); x.lineTo(h,S-2); x.stroke();
      return c;
    });
    starRGB=p.star; meteorRGB=p.meteor;
  }
  let starRGB=[], meteorRGB='255,255,255';

  function resize(){
    W=innerWidth; H=innerHeight;
    cv.width=W; cv.height=H;           // 1x resolution: soft scene, big saving on retina screens
    const area=W*H/1e4;
    const star=(rmin,rmax,flare)=>({x:rnd(0,W),y:rnd(0,H),r:rnd(rmin,rmax),ph:rnd(0,6.28),tw:rnd(.0008,.0025),c:Math.floor(rnd(0,3)),flare});
    layers=[
      {speed:2,depth:4, stars:Array.from({length:Math.min(320,Math.floor(area*1.0))},()=>star(.5,1.1,false))},
      {speed:5,depth:10,stars:Array.from({length:Math.min(130,Math.floor(area*.4))},()=>star(.9,1.6,false))},
      {speed:9,depth:20,stars:Array.from({length:Math.min(36,Math.floor(area*.1))},()=>star(1.4,2.4,true))}
    ];
    bake();
  }

  function render(t,dt){
    px+=(mx-px)*.06; py+=(my-py)*.06;
    const dx=Math.sin(t*.00006)*M*.5 - px*6, dy=Math.cos(t*.00005)*M*.4 - py*6;
    ctx.globalAlpha=1;
    ctx.drawImage(bg,-M+dx,-M+dy,W+2*M,H+2*M);

    for(const L of layers){
      const ox=-px*L.depth, oy=-py*L.depth;
      for(const s of L.stars){
        s.x-=L.speed*dt; if(s.x<-10) s.x+=W+20;
        const a=.35+.65*(.5+.5*Math.sin(t*s.tw+s.ph));
        const x=((s.x+ox)%W+W)%W, y=((s.y+oy)%H+H)%H;
        ctx.globalAlpha=a;
        if(s.flare){ const z=s.r*11; ctx.drawImage(sprites[s.c],x-z/2,y-z/2,z,z); }
        else { ctx.fillStyle=`rgb(${starRGB[s.c]})`; ctx.fillRect(x-s.r,y-s.r,s.r*2,s.r*2); }
      }
    }
    ctx.globalAlpha=1;
    ctx.drawImage(planet,W*.9-planet.width/2,H*.92+Math.sin(t*.0002)*6-planet.height/2);

    nextMeteor-=dt*1000;
    if(nextMeteor<=0){ meteors.push({x:rnd(W*.3,W*1.1),y:rnd(-20,H*.35),vx:-rnd(260,420),vy:rnd(110,180),life:0,max:rnd(1.1,1.6)}); nextMeteor=rnd(4000,9000); }
    meteors=meteors.filter(m=>m.life<m.max);
    for(const m of meteors){
      m.life+=dt; m.x+=m.vx*dt; m.y+=m.vy*dt;
      const k=Math.sin(Math.PI*m.life/m.max), tx=m.x-m.vx*.22, ty=m.y-m.vy*.22;
      const mg=ctx.createLinearGradient(m.x,m.y,tx,ty);
      mg.addColorStop(0,`rgba(${meteorRGB},${.9*k})`); mg.addColorStop(1,`rgba(${meteorRGB},0)`);
      ctx.strokeStyle=mg; ctx.lineWidth=1.8; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tx,ty); ctx.stroke();
    }
  }

  function loop(t){
    if(document.hidden){ running=false; return; }
    if(window.__bgHold){ last=t; requestAnimationFrame(loop); return; }   // paused while pull effects play
    acc+=t-last; last=t;
    if(acc>=STEP){ render(t,Math.min(.1,acc/1000)); acc=0; }
    requestAnimationFrame(loop);
  }
  function start(){ if(reduceMotion||running) return; running=true; last=performance.now(); acc=STEP; requestAnimationFrame(loop); }

  addEventListener('pointermove',e=>{ mx=(e.clientX/W-.5)*2; my=(e.clientY/H-.5)*2; },{passive:true});
  let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ resize(); render(performance.now(),0); },150); });
  document.addEventListener('visibilitychange',start);
  darkMQ.addEventListener?.('change',()=>{ bake(); render(performance.now(),0); });
  resize(); render(performance.now(),0); start();
})();

/* ================= Sparkle cursor + bursts (sprite-based) ================= */
const Sparkle = (function(){
  const cv=document.getElementById('sparkle'), ctx=cv.getContext('2d');
  const MAX=360;
  let W,H,DPR, ps=[], running=false;
  const COLORS=['#fff6c9','#f3d38a','#9be7ff','#ffb3e6','#ffffff'];
  const GOLD=['#fff6c9','#f3d38a','#ffd56b','#ffffff','#ffe08a'];
  const BLUE=['#bcd3ff','#9be7ff','#ffffff'];
  const cache={};
  // Pre-render each colour once as a glowing 4-point star (replaces per-particle shadowBlur)
  function sprite(col){
    if(cache[col]) return cache[col];
    const S=48, c=document.createElement('canvas'); c.width=c.height=S;
    const x=c.getContext('2d'), h=S/2;
    const g=x.createRadialGradient(h,h,0,h,h,h);
    g.addColorStop(0,col); g.addColorStop(.25,col+'88'); g.addColorStop(1,col+'00');
    x.fillStyle=g; x.fillRect(0,0,S,S);
    x.fillStyle='#fff'; x.beginPath();
    for(let i=0;i<8;i++){ const rr=i%2?h*.12:h*.62, a=i*Math.PI/4-Math.PI/2; x.lineTo(h+Math.cos(a)*rr,h+Math.sin(a)*rr); }
    x.closePath(); x.fill();
    return cache[col]=c;
  }
  function resize(){ DPR=1; W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  resize(); addEventListener('resize',resize);
  function add(p){ if(ps.length>=MAX) return; ps.push(p); if(!running){ running=true; requestAnimationFrame(loop);} }
  function spawn(x,y,n,opt={}){
    const cols=opt.colors||COLORS;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=(opt.speed||1)*(Math.random()*1.2+.2);
      add({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(opt.up||.3),g:opt.g??.04,
        r:(opt.size||1)*(Math.random()*3+2),life:0,max:(opt.life||45)+Math.random()*25,c:cols[Math.floor(Math.random()*cols.length)]});
    }
  }
  let lx=null,ly=null,lt=0;
  addEventListener('pointermove',e=>{
    if(reduceMotion || e.pointerType==='touch') return;
    const now=performance.now(); if(now-lt<24) return; lt=now;   // throttle trail
    const d=lx===null?10:Math.hypot(e.clientX-lx,e.clientY-ly);
    lx=e.clientX; ly=e.clientY;
    if(d>2) spawn(e.clientX,e.clientY,Math.min(3,1+Math.floor(d/20)),{speed:.6,up:.2,life:32});
  },{passive:true});
  addEventListener('pointerdown',e=>{ if(!reduceMotion) spawn(e.clientX,e.clientY,12,{speed:2.2,life:38}); },{passive:true});
  function loop(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    let n=0;
    for(const p of ps){
      p.life++; if(p.life<0){ ps[n++]=p; continue; }
      if(p.life>=p.max) continue;
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.98;
      const k=1-p.life/p.max, z=p.r*4.2*(.45+.55*k);
      ctx.globalAlpha=k;
      ctx.drawImage(sprite(p.c),p.x-z/2,p.y-z/2,z,z);
      ps[n++]=p;
    }
    ps.length=n;
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    if(ps.length) requestAnimationFrame(loop); else { running=false; ctx.clearRect(0,0,W,H); }
  }
  return {
    burst:(x,y,big)=>{ if(reduceMotion) return;
      if(big){ spawn(x,y,70,{speed:7.5,size:1.7,life:55,g:.07,up:1.6,colors:GOLD}); spawn(x,y,20,{speed:2.5,size:2.4,life:70,g:.02,up:.5,colors:GOLD}); }
      else spawn(x,y,8,{speed:2,life:28,g:.06,up:.3,colors:BLUE});
    },
    rain:(b)=>{ if(reduceMotion) return;
      for(let i=0;i<28;i++) add({x:b.left-60+Math.random()*(b.width+120),y:b.top-Math.random()*220,vx:(Math.random()-.5)*.4,vy:.4+Math.random()*1.2,g:.008,
        r:Math.random()*2.5+1.5,life:-Math.floor(Math.random()*40),max:110+Math.random()*60,c:GOLD[Math.floor(Math.random()*GOLD.length)]});
    }
  };
})();

/* ================= Calculator + simulator ================= */
(function(){
  const $ = id => document.getElementById(id);
  const fmt = (n,d=0) => n.toLocaleString('zh-TW',{maximumFractionDigits:d,minimumFractionDigits:d});
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  const state = {pulls:0,hits:0,spent:0,sincePity:0,pityTriggers:0,log:[]};
  let cfg=null, busy=false;

  function readConfig(){
    const rate=parseFloat($('rate').value), pityOn=$('pityOn').checked,
          pity=parseInt($('pity').value,10), price=parseFloat($('price').value);
    let ok=true;
    $('rateErr').textContent=$('pityErr').textContent=$('priceErr').textContent='';
    if(!(rate>0&&rate<=100)){ $('rateErr').textContent='請輸入 0 到 100 之間的機率（不含 0）。'; ok=false; }
    if(pityOn&&!(Number.isInteger(pity)&&pity>=1)){ $('pityErr').textContent='保底抽數須為 1 以上的整數。'; ok=false; }
    if(!(price>=0)){ $('priceErr').textContent='單抽金額不可為負數。'; ok=false; }
    return ok?{p:rate/100,pityOn,pity,price}:null;
  }
  function quantile(c,q){
    if(c.p>=1) return 1;
    let n=Math.ceil(Math.log(1-q)/Math.log(1-c.p));
    if(c.pityOn) n=Math.min(n,c.pity);
    return Math.max(1,n);
  }
  function countUp(el,to,dec,prefix=''){
    if(reduceMotion){ el.textContent=prefix+fmt(to,dec); return; }
    const t0=performance.now(), D=700;
    (function step(t){ const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3);
      el.textContent=prefix+fmt(to*e,dec); if(k<1) requestAnimationFrame(step); })(t0);
  }

  function submit(){
    const c=readConfig();
    if(!c) return;
    cfg=c;
    $('dirty').classList.remove('show');
    document.querySelectorAll('.ev-item').forEach(el=>{ el.classList.remove('refresh'); void el.offsetWidth; el.classList.add('refresh'); });
    const {p,pityOn,pity,price}=cfg;
    // Hard pity N: E = Σ_{k=0}^{N-1} (1-p)^k = (1-(1-p)^N)/p ; no pity: 1/p
    const E = pityOn ? (1-Math.pow(1-p,pity))/p : 1/p;
    cfg.E = E;
    countUp($('evPulls'),E,E<100?2:1);
    countUp($('evCost'),E*price,0,'NT$');
    const q50=quantile(cfg,.5), q90=quantile(cfg,.9);
    $('quant').innerHTML=`一半的人在 <b>${fmt(q50)}</b> 抽內命中（NT$${fmt(q50*price)}），九成的人在 <b>${fmt(q90)}</b> 抽內命中（NT$${fmt(q90*price)}）`+
      (pityOn?`；最差情況 <b>${fmt(pity)}</b> 抽（NT$${fmt(pity*price)}）。`:'；無保底時沒有上限。');
    reset();
  }

  function pullOnce(){
    state.sincePity++;
    let hit=false, byPity=false;
    if(cfg.pityOn&&state.sincePity>=cfg.pity){ hit=true; byPity=Math.random()>=cfg.p; }
    else hit=Math.random()<cfg.p;
    state.pulls++; state.spent+=cfg.price;
    const at=state.sincePity;
    if(hit){ state.hits++; if(byPity) state.pityTriggers++; state.log.unshift({n:state.pulls,at,byPity}); state.sincePity=0; }
    return {hit,at,byPity,idx:state.pulls};
  }

  function cinematic(times,gold){
    return new Promise(resolve=>{
      const fx=$('fx');
      fx.querySelectorAll('.meteor').forEach(m=>m.remove());
      const mc = gold?'#ffd56b':'#8fb6ff';
      fx.style.setProperty('--fc', gold?'rgba(255,214,120,.9)':'rgba(150,185,255,.85)');
      const n = times===10?4:1;
      for(let i=0;i<n;i++){
        const m=document.createElement('div'); m.className='meteor';
        const main=i===0;
        m.style.cssText=`--mc:${main?mc:'#bcd3ff'};--top:${main?18:rnd(5,45)}%;--len:${main?45:rnd(18,28)}vmax;--th:${main?5:2}px;--dur:${main?1.1:rnd(.8,1.1)}s;--delay:${main?0:rnd(.05,.4)}s`;
        fx.insertBefore(m,$('flash'));
      }
      const fl=$('flash'); fl.style.animation='none'; void fl.offsetWidth; fl.style.animation='';
      fx.hidden=false;
      let done=false;
      const finish=()=>{ if(done) return; done=true; fx.hidden=true; resolve(); };
      fx.onclick=finish;
      setTimeout(finish,1650);
    });
    function rnd(a,b){ return a+Math.random()*(b-a); }
  }

  async function draw(times){
    if(!cfg||busy) return;
    busy=true; setButtons();
    const res=[]; for(let i=0;i<times;i++) res.push(pullOnce());
    const gold=res.some(r=>r.hit);
    const box=$('results');
    box.classList.remove('gold-ring');
    window.__bgHold=true;   // freeze the background so the pull effects get the full frame budget
    if(!reduceMotion) await cinematic(times,gold);

    box.innerHTML='';
    const cards=res.map((r,i)=>{
      const c=document.createElement('div');
      c.className='card '+(r.hit?'hit':'miss');
      c.style.animationDelay=(i*45)+'ms';
      c.setAttribute('aria-label',r.hit?`第 ${r.idx} 抽命中`:`第 ${r.idx} 抽未中`);
      c.innerHTML=`<div class="inner"><div class="face back">✦</div><div class="face front"><div class="gem"></div><div class="stars">${r.hit?'★★★★★':'★★★'}</div><div class="n">#${r.idx}</div></div></div>`;
      box.appendChild(c); return c;
    });

    if(reduceMotion){ cards.forEach(c=>c.classList.add('flipped')); }
    else{
      await sleep(times*45+250);
      for(let i=0;i<cards.length;i++){
        const c=cards[i], r=res[i];
        if(r.hit){ c.classList.add('charging'); await sleep(700); c.classList.remove('charging'); }
        c.classList.add('flipped');
        setTimeout(()=>{
          const b=c.getBoundingClientRect();
          if(r.hit){ goldFx(c,b); box.classList.add('gold-ring'); }
          else Sparkle.burst(b.left+b.width/2,b.top+b.height/2,false);
        },r.hit?160:280);
        await sleep(r.hit?1150:110);
      }
    }
    if(reduceMotion&&gold) box.classList.add('gold-ring');

    const hits=res.filter(r=>r.hit);
    $('banner').textContent=hits.length
      ? hits.map(h=>`第 ${h.idx} 抽命中（墊了 ${h.at} 抽${h.byPity?'，保底觸發':''}）`).join('　')
      : (times===1?'未命中，再接再厲。':'這十抽沒有命中。');
    const bn=$('banner'); bn.classList.toggle('gold',hits.length>0);
    if(hits.length) bn.textContent='✦ '+bn.textContent+' ✦';
    renderStats();
    window.__bgHold=false;
    busy=false; setButtons();
  }

  function goldFx(c,b){
    const cx=b.left+b.width/2, cy=b.top+b.height/2, box=$('results');
    c.classList.add('pop');
    const mk=(cls,style)=>{ const d=document.createElement('div'); d.className=cls; Object.entries(style).forEach(([k,v])=>d.style.setProperty(k,v)); document.body.appendChild(d); setTimeout(()=>d.remove(),1700); };
    mk('gfx-flash',{'--x':cx+'px','--y':cy+'px'});
    mk('gfx-pillar',{left:cx+'px',width:b.width*1.8+'px',height:b.bottom+'px'});
    mk('gfx-shock',{left:cx+'px',top:cy+'px'});
    mk('gfx-shock late',{left:cx+'px',top:cy+'px'});
    Sparkle.burst(cx,cy,true);
    Sparkle.rain(b);
  }

  function setButtons(){
    $('one').disabled=$('ten').disabled=!cfg||busy;
    $('reset').disabled=busy;
  }

  function renderStats(){
    const setV=(id,tile,text)=>{ const el=$(id); if(el.textContent===text) return; el.textContent=text;
      if(!reduceMotion&&state.pulls){ const t=$(tile); t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump'); } };
    const setSub=(id,text,cls='')=>{ const el=$(id); el.textContent=text; el.className='sub'+(cls?' '+cls:''); };
    const avg=state.hits?state.pulls/state.hits:null, rate=state.pulls?state.hits/state.pulls:null;

    setV('sPulls','tPulls',fmt(state.pulls));
    setSub('subPulls',state.pulls?`約 ${fmt(Math.floor(state.pulls/10))} 次十連`:'');
    setV('sHits','tHits',fmt(state.hits));
    setSub('subHits',state.hits?`其中保底 ${fmt(state.pityTriggers)} 次`:'');
    setV('sCost','tCost',fmt(state.spent));
    setSub('subCost',state.hits?`每次命中 NT$${fmt(state.spent/state.hits)}`:'');
    setV('sAvg','tAvg',avg===null?'—':fmt(avg,1));
    if(cfg&&avg!==null) setSub('subAvg',`期望 ${fmt(cfg.E,1)} 抽`,avg<=cfg.E?'up':'down'); else setSub('subAvg',cfg?`期望 ${fmt(cfg.E,1)} 抽`:'');
    setV('sRate','tRate',rate===null?'—':fmt(rate*100,2));
    const theo=cfg?1/cfg.E*100:0;
    if(cfg&&rate!==null&&state.hits) setSub('subRate',`綜合理論 ${fmt(theo,2)}%`,rate*100>=theo?'up':'down'); else setSub('subRate',cfg?`綜合理論 ${fmt(theo,2)}%`:'');
    setV('sPity','tPity',fmt(state.pityTriggers));
    setSub('subPity',cfg&&cfg.pityOn?`每 ${fmt(cfg.pity)} 抽必中`:'未開啟保底');

    // pity gauge
    const C=326.73, g=$('gauge');
    $('gNum').textContent=fmt(state.sincePity);
    if(cfg&&cfg.pityOn){
      const r=Math.min(1,state.sincePity/cfg.pity);
      $('gFill').style.strokeDashoffset=C*(1-r);
      $('gMax').textContent=`/ ${fmt(cfg.pity)} 抽`;
      const near=r>=.75;
      g.classList.toggle('near',near);
      $('gLabel').textContent=near?`再 ${fmt(cfg.pity-state.sincePity)} 抽保底`:'保底進度';
    } else {
      $('gFill').style.strokeDashoffset=C;
      $('gMax').textContent='抽未中';
      g.classList.remove('near');
      $('gLabel').textContent='無保底';
    }
    $('log').innerHTML = state.log.length
      ? state.log.slice(0,100).map(l=>`<li>總第 <b>${l.n}</b> 抽命中，墊了 ${l.at} 抽${l.byPity?'（保底）':''}</li>`).join('')
      : '<li class="none">尚未命中</li>';
  }

  function reset(){
    Object.assign(state,{pulls:0,hits:0,spent:0,sincePity:0,pityTriggers:0,log:[]});
    $('results').innerHTML='<div class="empty">按下抽卡開始</div>';
    $('results').classList.remove('gold-ring');
    $('banner').textContent='';
    $('banner').classList.remove('gold');
    renderStats(); setButtons();
  }

  $('pityOn').addEventListener('change',e=>{ $('pityField').classList.toggle('open',e.target.checked); $('dirty').classList.add('show'); });
  ['rate','pity','price'].forEach(id=>$(id).addEventListener('input',()=>$('dirty').classList.add('show')));
  $('form').addEventListener('submit',e=>{ e.preventDefault(); submit(); });
  $('one').addEventListener('click',()=>draw(1));
  $('ten').addEventListener('click',()=>draw(10));
  $('reset').addEventListener('click',reset);

  submit();
})();
</script>
</body>
</html>
